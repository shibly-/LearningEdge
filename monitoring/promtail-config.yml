server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Keep only the LearningEdge web containers
      - source_labels: ['__meta_docker_container_name']
        regex: '/(api|ui|keycloak|parser)'
        action: keep
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream
    pipeline_stages:
      # Docker stores each line as JSON: {"log":"...","stream":"stdout","time":"..."}
      - docker: {}
      # Serilog console lines look like: [13:04:28 INF] Database migrations applied.
      - regex:
          expression: '^\[(?P<timestamp>\d{2}:\d{2}:\d{2}) (?P<level>[A-Z]{3})\] (?P<message>.*)'
      - labels:
          level: