# Select this theme in Realm settings → Themes → Login theme: learningedge
parent=keycloak.v2

# `styles` replaces the parent list, so the parent stylesheet stays first.
styles=css/styles.css css/learningedge.css

# The Angular app is light-only. Keep the login pages on the same palette.
darkMode=false

favicons.svg=img/favicon.svg
favicons.svg.rel=icon
favicons.svg.type=image/svg+xml
