services:
  ui:
    container_name: ui
    build:
      context: ./LearningEdgeUI
      dockerfile: Dockerfile
    ports:
      # Not 4200: that is the `ng serve` port, and the two would collide
      # whenever the stack and a local dev server run side by side.
      - "4300:80"
    depends_on:
      - api
    restart: on-failure
    networks:
      - appnet

  api:
    container_name: api
    build:
      context: ./LearningEdge
      dockerfile: Dockerfile
    ports:
      - "5000:80"
      - "5001:443"
    volumes:
      - ./certs:/https:ro
      - uploads:/api/uploads
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: "https://+:443;http://+:80"
      ASPNETCORE_HTTPS_PORT: "5001"
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/aspnetapp.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: "${CERT_PASSWORD:?Set CERT_PASSWORD in .env}"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=LearningEdgeDB;User Id=sqluser;Password=${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env};TrustServerCertificate=True;Encrypt=False;"
    depends_on:
      sqlserver:
        condition: service_healthy   
      sqlserver-init:
        condition: service_completed_successfully  
    restart: on-failure
    networks:
      - appnet

  document-parser:
    container_name: document-parser
    build:
      context: .
      dockerfile: LearningEdgeMS/Dockerfile
    volumes:
      - uploads:/uploads
      - km_documents:/km-documents
    environment:
      DOTNET_ENVIRONMENT: Docker
      RabbitMQ__Host: rabbitmq
      RabbitMQ__VirtualHost: /
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
      FileStorage__RootPath: /uploads
      KernelMemory__Qdrant__Endpoint: http://qdrant:6333
      KernelMemory__DocumentStorageDirectory: /km-documents
      KernelMemory__OpenAI__APIKey: ${OPENAI_API_KEY:-}
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=LearningEdgeDB;User Id=sqluser;Password=${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env};TrustServerCertificate=True;Encrypt=False;"
    depends_on:
      rabbitmq:
        condition: service_started
      qdrant:
        condition: service_started
      sqlserver:
        condition: service_healthy
      sqlserver-init:
        condition: service_completed_successfully
    restart: on-failure
    networks:
      - appnet

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:?Set SA_PASSWORD in .env}"
    ports:
      - "11433:1433"
    volumes:
      - sqlvolume:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - appnet  
  
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./docker/mssql/init-db.sql:/init/init-db.sql:ro
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${SA_PASSWORD:?Set SA_PASSWORD in .env}"
      APP_DB_PASSWORD: "${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - '/opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$SA_PASSWORD" -C -b -v APP_DB_PASSWORD="$$APP_DB_PASSWORD" -i /init/init-db.sql'
    networks:
      - appnet
    restart: "no"
  
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq/20-allow-guest.conf:/etc/rabbitmq/conf.d/20-allow-guest.conf:ro
    networks:
      - appnet  
      
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - appnet
      
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    networks:
      - appnet
    volumes:
      - ollama_data:/root/.ollama  # persist models
    restart: unless-stopped
    entrypoint: >
      sh -c "
      ollama serve &
      sleep 5 &&
      ollama pull llama3.1:8b &&
      ollama pull qwen3-embedding:0.6b &&      
      tail -f /dev/null
      "  

networks:
  appnet:    

volumes:
  sqlvolume:
  uploads:
  rabbitmq_data:
  qdrant_storage:
  km_documents:
  ollama_data:
