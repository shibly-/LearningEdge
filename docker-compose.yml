services:
  ui:
    container_name: ui
    build:
      context: ./LearningEdgeUI
      dockerfile: Dockerfile
    ports:
      # Not 4200: that is the `ng serve` port, and the two would collide
      # whenever the stack and a local dev server run side by side.
      - "4300:80"
    depends_on:
      - api
    profiles:
      - manual  
    restart: on-failure
    networks:
      - appnet

  api:
    container_name: api
    build:
      context: ./LearningEdge
      dockerfile: Dockerfile
    ports:
      - "5000:80"
      - "5001:443"
    volumes:
      - ./certs:/https:ro
      - uploads:/api/uploads
      - ./licenses/masstransit-license.txt:/masstransit/license.txt:ro
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: "https://+:443;http://+:80"
      ASPNETCORE_HTTPS_PORT: "5001"
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/aspnetapp.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: "${CERT_PASSWORD:?Set CERT_PASSWORD in .env}"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=LearningEdgeDB;User Id=sqluser;Password=${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env};TrustServerCertificate=True;Encrypt=False;"
      AUTOMAPPER_LICENSE_PATH: ${AUTOMAPPER_LICENSE}
      Redis__Connection: "redis:6379"            
    depends_on:
      keycloak:
        condition: service_started
      redis:
        condition: service_started
      sqlserver:
        condition: service_healthy          
    profiles:
      - manual    
    restart: on-failure
    networks:
      - appnet

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:?Set SA_PASSWORD in .env}"
    ports:
      - "11433:1433"
    volumes:
      - sqlvolume:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - appnet
  
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RabbitMQ_Username}
      RABBITMQ_DEFAULT_PASS: ${RabbitMQ_Password}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq/20-allow-guest.conf:/etc/rabbitmq/conf.d/20-allow-guest.conf:ro
    networks:
      - appnet  
      
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - appnet
      
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    networks:
      - appnet
    volumes:
      - ollama_data:/root/.ollama  # persist models
    restart: unless-stopped
    entrypoint: >
      sh -c "
      ollama serve &
      sleep 5 &&
      ollama pull llama3.1:8b &&
      ollama pull qwen3-embedding:0.6b &&      
      tail -f /dev/null
      "  
      
  redis:
    image: redis:7.2
    container_name: redis
    ports:
      # 6379 on the host is taken by the Windows Redis service, so Visual Studio
      # reaches this container through 6380. Containers still use redis:6379.
      - "6380:6379"
    volumes:
      - redisdata:/data  
      
  redis-commander:
    image: rediscommander/redis-commander:latest
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
  
  postgres:
    image: postgres:16
    container_name: keycloak-db
    environment:
      POSTGRES_DB: ${KEYCLOAK_POSTGRES_DB}
      POSTGRES_USER: ${KEYCLOAK_DB_USERNAME}
      POSTGRES_PASSWORD: "${KEYCLOAK_DB_PASSWORD}"      
    ports:
      - "5432:5432"
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USERNAME} -d ${KEYCLOAK_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
    - appnet  
  
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: keycloak
    ports:
      - "8443:8443"
    depends_on:
      postgres:
        condition: service_healthy  
    volumes:
      - ./certs:/opt/keycloak/conf/certs
      - keycloak_data:/opt/keycloak/data
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: ${KEYCLOAK_POSTGRES_DB}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME}
      KC_DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD}"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}    
    command:
      - start-dev
      - --https-key-store-file=/opt/keycloak/conf/certs/keycloak.pfx
      - --https-key-store-password=Password123!    
    networks:
      - appnet      

  document-parser:
    container_name: document-parser
    build:
      context: .
      dockerfile: LearningEdgeMS/Dockerfile
    volumes:
      - uploads:/uploads
      - ./licenses/masstransit-license.txt:/masstransit/license.txt:ro      
    environment:
      DOTNET_ENVIRONMENT: Docker            
      RabbitMQ__Host: rabbitmq
      RabbitMQ__VirtualHost: /
      RabbitMQ__Username: ${RabbitMQ_Username}
      RabbitMQ__Password: ${RabbitMQ_Password}
      FileStorage__RootPath: /uploads
      KernelMemory__Qdrant__Endpoint: http://qdrant:6333      
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=LearningEdgeDB;User Id=sqluser;Password=${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env};TrustServerCertificate=True;Encrypt=False;"
      Redis__Connection: "redis:6379"    
    depends_on:
      rabbitmq:
        condition: service_started
      qdrant:
        condition: service_started
      sqlserver:
        condition: service_healthy      
    restart: on-failure
    networks:
      - appnet

networks:
  appnet:    

volumes:
  sqlvolume:
  uploads:
  rabbitmq_data:
  qdrant_storage:
  ollama_data:
  redisdata:
  keycloak_data:
  keycloak-db-data:
